name: Build & Publish Urmi Enterprise APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Urmi Enterprise APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk urmi-enterprise.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: "ঊর্মি এন্টারপ্রাইজ ${{ github.event.inputs.version_tag || github.ref_name }}"
          body: "ঊর্মি এন্টারপ্রাইজ (Urmi Enterprise) অটো-আপডেট রিলিজ (${{ github.event.inputs.version_tag || github.ref_name }})"
          files: urmi-enterprise.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build & Publish Urmi Enterprise APK Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Extract App Version & Build Urmi Enterprise APK
        id: build_apk
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.1"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version_tag }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.version_tag }}"
          else
            RELEASE_TAG="v${VERSION_NAME}"
          fi
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk urmi-enterprise.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_apk.outputs.release_tag }}
          name: "ঊর্মি এন্টারপ্রাইজ ${{ steps.build_apk.outputs.release_tag }}"
          body: "ঊর্মি এন্টারপ্রাইজ (Urmi Enterprise) অটো-আপডেট রিলিজ (${{ steps.build_apk.outputs.release_tag }})"
          files: urmi-enterprise.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
